# The pure-Python point arithmetic, mutated: `curve_group.py`'s generic
# window, ladder and NAF methods and `curve_group_2.py`'s secp256k1-only
# GLV endomorphism and interleaved wNAF. `curve.py`'s dispatch sends a
# default-curve call to the libsecp256k1 bindings before either module's
# code runs, so no other profile reaches them.
#
# Neither module goes through that dispatch here: the test files below
# call the underscore-prefixed algorithm functions directly, secp256k1
# included, so a mutant is reached without switching the bindings off.
#
# The survivors of these two modules were weighed on btclib-org/btclib's
# copies of them, in its own `.github/mutation/curve_group.toml`,
# whose header sorts them into families. This tree's scheduled run and
# its `curve_group-survivors.txt` artifact are where the next weighing
# reads from.

[cosmic-ray]
module-path = [
    "src/btclib_ecc/curves/curve_group.py",
    "src/btclib_ecc/curves/curve_group_2.py",
]

# each module's own file, and curve_test.py for what curve_group.py
# defines and only it asserts: `CurveGroup.__init__`'s parameter checks,
# `_is_prime`, `p_is_3_mod_4`, and the y-symmetry and coordinate
# extraction methods. curve_group_f_test.py stays out, its subject being
# curve_group_f.py, a module this scope does not name
test-command = """python -m pytest -x -q -n0 -p no:randomly \
  tests/curves/curve_group_test.py tests/curves/curve_group_2_test.py \
  tests/curves/curve_test.py"""

# seconds of wall clock: a timeout is reported KILLED, so slack is the
# safe direction
timeout = 300

excluded-modules = []

# No `BitOr` exclusion: `m | 1` in both modules is the odd-digit
# recoding, code and not an annotation
#
#   grep -n ' | ' src/btclib_ecc/curves/curve_group.py \
#     src/btclib_ecc/curves/curve_group_2.py

[cosmic-ray.distributor]
name = "local"
