---
name: Feature request
description: Add something to ellipticcurves, or change how it works
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: >
        ellipticcurves is elliptic curve arithmetic and the signature,
        key-agreement and commitment schemes built on it, over any curve in
        short Weierstrass form. What a scheme encodes for a protocol above
        it -- an address, a script, a transaction -- is that protocol's
        library and not this one.

  - type: textarea
    id: what
    attributes:
      label: What is missing
      description: >
        What it would let a caller do, and how the call would read.
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Specification
      description: >
        The standard, BIP, RFC or reference implementation that defines it.
        What has no specification has no test vectors either, which is the
        harder half of adding it.
      placeholder: "BIP340, https://github.com/bitcoin/bips/blob/master/bip-0340.mediawiki"

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in ellipticcurves
      description: >
        What cannot be done today with what the package already exposes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other spellings of the same feature, and what an existing caller
        would have to change if this were added.
